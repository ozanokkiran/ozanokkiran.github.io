<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inverse Trigonometry Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        h1 {
            color: #4a6572;
            margin-bottom: 5px;
            font-size: 2.2em;
        }
        p.subtitle {
            color: #7a8b94;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.2em;
        }
        .container {
            display: flex;
            gap: 25px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 1200px;
            width: 95%;
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 320px;
            background-color: #f4f6f8;
            padding: 20px;
            border-radius: 8px;
            flex-shrink: 0;
        }
        
        /* Checkbox Grid Design */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #dce3e8;
        }
        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .col-title {
            font-weight: bold;
            color: #4a6572;
            font-size: 14px;
            margin-bottom: 5px;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 5px;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .checkbox-wrapper input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        .checkbox-wrapper.main-func { color: #4a6572; font-weight: 600; }
        .checkbox-wrapper.inv-func { color: #d96459; font-weight: 600; }

        .info-box {
            background: #fff;
            border-left: 4px solid #5b9aa0;
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100px;
        }
        .info-box span.main-val { font-weight: bold; color: #4a6572; }
        .info-box span.inv-val { font-weight: bold; color: #d96459; }
        
        .legend {
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #dce3e8;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .color-box { width: 16px; height: 16px; border-radius: 3px; }
        
        .canvas-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eef2f5;
            border-radius: 8px;
            border: 1px solid #dce3e8;
            overflow: hidden;
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
        }
        .controls-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(255,255,255,0.8);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #7a8b94;
            pointer-events: none;
        }
        .reset-btn {
            background-color: #5b9aa0;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }
        .reset-btn:hover { background-color: #4a8288; }
    </style>
</head>
<body>

    <h1>Inverse Trigonometric Functions</h1>
    <p class="subtitle">Interactive Graphs: Zoom (Scroll) and Pan (Drag)</p>

    <div class="container">
        <!-- Left Control Panel -->
        <div class="panel">
            
            <div class="controls-grid">
                <div class="controls-column">
                    <div class="col-title">Main Function</div>
                    <label class="checkbox-wrapper main-func"><input type="checkbox" id="chk-sin" checked> sin(x)</label>
                    <label class="checkbox-wrapper main-func"><input type="checkbox" id="chk-cos"> cos(x)</label>
                    <label class="checkbox-wrapper main-func"><input type="checkbox" id="chk-tan"> tan(x)</label>
                    <label class="checkbox-wrapper main-func"><input type="checkbox" id="chk-cot"> cot(x)</label>
                </div>
                <div class="controls-column">
                    <div class="col-title">Arc Function</div>
                    <label class="checkbox-wrapper inv-func"><input type="checkbox" id="chk-asin" checked> arcsin(x)</label>
                    <label class="checkbox-wrapper inv-func"><input type="checkbox" id="chk-acos"> arccos(x)</label>
                    <label class="checkbox-wrapper inv-func"><input type="checkbox" id="chk-atan"> arctan(x)</label>
                    <label class="checkbox-wrapper inv-func"><input type="checkbox" id="chk-acot"> arccot(x)</label>
                </div>
            </div>

            <div class="info-box" id="infoBox">
                Domain and range of selected functions will appear here.
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="color-box" style="background-color: rgba(166, 184, 199, 0.3);"></div>
                    <span>Full Function (Faded)</span>
                </div>
                <div class="legend-item">
                    <div class="color-box" style="background-color: #4a6572;"></div>
                    <span>Restricted Main Function</span>
                </div>
                <div class="legend-item">
                    <div class="color-box" style="background-color: #d96459;"></div>
                    <span>Inverse Function (Arc)</span>
                </div>
                <div class="legend-item">
                    <div class="color-box" style="background-color: #f2ae72; height: 3px; border-radius: 0;"></div>
                    <span>Line of Symmetry (y = x)</span>
                </div>
                <button class="reset-btn" onclick="resetView()">Reset View</button>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-container" id="canvasContainer">
            <canvas id="mathCanvas" width="800" height="600"></canvas>
            <div class="controls-hint">Scroll: Zoom | Drag: Pan</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const infoBox = document.getElementById('infoBox');

        // Checkbox Elements
        const checks = {
            sin: document.getElementById('chk-sin'),
            cos: document.getElementById('chk-cos'),
            tan: document.getElementById('chk-tan'),
            cot: document.getElementById('chk-cot'),
            asin: document.getElementById('chk-asin'),
            acos: document.getElementById('chk-acos'),
            atan: document.getElementById('chk-atan'),
            acot: document.getElementById('chk-acot')
        };

        // View Variables (Pan & Zoom)
        let offsetX = canvas.width / 2;
        let offsetY = canvas.height / 2;
        let scale = 120; // START MORE ZOOMED IN
        
        let isDragging = false;
        let dragStartX, dragStartY;

        // Mathematical Data
        const funcData = {
            sin: { name: "sin(x)", dom: "[-π/2, π/2]", rng: "[-1, 1]", rMin: -Math.PI/2, rMax: Math.PI/2, func: Math.sin },
            cos: { name: "cos(x)", dom: "[0, π]", rng: "[-1, 1]", rMin: 0, rMax: Math.PI, func: Math.cos },
            tan: { name: "tan(x)", dom: "(-π/2, π/2)", rng: "(-∞, ∞)", rMin: -Math.PI/2 + 0.01, rMax: Math.PI/2 - 0.01, func: Math.tan },
            cot: { name: "cot(x)", dom: "(0, π)", rng: "(-∞, ∞)", rMin: 0.01, rMax: Math.PI - 0.01, func: (x) => 1/Math.tan(x) },
            asin: { name: "arcsin(x)", dom: "[-1, 1]", rng: "[-π/2, π/2]", rMin: -1, rMax: 1, func: Math.asin },
            acos: { name: "arccos(x)", dom: "[-1, 1]", rng: "[0, π]", rMin: -1, rMax: 1, func: Math.acos },
            atan: { name: "arctan(x)", dom: "(-∞, ∞)", rng: "(-π/2, π/2)", rMin: -20, rMax: 20, func: Math.atan },
            acot: { name: "arccot(x)", dom: "(-∞, ∞)", rng: "(0, π)", rMin: -20, rMax: 20, func: (x) => Math.PI/2 - Math.atan(x) }
        };

        // Responsive Canvas
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            if(!isDragging) {
                offsetX = canvas.width / 2;
                offsetY = canvas.height / 2;
            }
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        function resetView() {
            offsetX = canvas.width / 2;
            offsetY = canvas.height / 2;
            scale = 120; // RESET TO ZOOMED IN
            draw();
        }

        // --- Mouse Events (Pan & Zoom) ---
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.clientX - offsetX;
            dragStartY = e.clientY - offsetY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = e.clientX - dragStartX;
                offsetY = e.clientY - dragStartY;
                draw();
            }
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSensitivity = 0.001;
            const delta = Math.exp(-e.deltaY * zoomSensitivity);
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            offsetX = mouseX - (mouseX - offsetX) * delta;
            offsetY = mouseY - (mouseY - offsetY) * delta;
            scale *= delta;
            
            draw();
        });

        function drawAxes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Grid and Labels
            ctx.beginPath();
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#7a8b94';
            ctx.font = "12px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const startX = Math.floor(-offsetX / scale);
            const endX = Math.ceil((canvas.width - offsetX) / scale);
            const startY = Math.floor(-(canvas.height - offsetY) / scale);
            const endY = Math.ceil(offsetY / scale);
            
            function formatLabel(val) {
                if(val === 0) return "0";
                const piMult = val / Math.PI;
                const roundPi = Math.round(piMult * 2) / 2; 
                if (Math.abs(piMult - roundPi) < 0.05) {
                    if (roundPi === 1) return "π";
                    if (roundPi === -1) return "-π";
                    if (roundPi === 0.5) return "π/2";
                    if (roundPi === -0.5) return "-π/2";
                    if (roundPi === 1.5) return "3π/2";
                    if (roundPi === -1.5) return "-3π/2";
                    if (roundPi % 1 !== 0) return (roundPi * 2) + "π/2";
                    return roundPi + "π";
                }
                if (Math.abs(Math.round(val) - val) < 0.05) return Math.round(val).toString();
                return "";
            }

            // Vertical Lines (X-Axis)
            for (let i = startX; i <= endX; i += 0.5) { 
                const x = offsetX + (i * scale);
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
                
                let label = formatLabel(i);
                if(label !== "" && label !== "0") {
                    ctx.fillText(label, x, offsetY + 15);
                }
            }

            // Horizontal Lines (Y-Axis)
            for (let i = startY; i <= endY; i += 0.5) {
                const y = offsetY - (i * scale);
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
                
                let label = formatLabel(i);
                if(label !== "" && label !== "0") {
                    ctx.fillText(label, offsetX - 15, y);
                }
            }
            ctx.stroke();

            // Main Axes
            ctx.beginPath();
            ctx.strokeStyle = '#8da2b0';
            ctx.lineWidth = 2;
            ctx.moveTo(offsetX, 0); ctx.lineTo(offsetX, canvas.height);
            ctx.moveTo(0, offsetY); ctx.lineTo(canvas.width, offsetY);
            ctx.stroke();

            // Origin
            ctx.fillText("0", offsetX - 10, offsetY + 12);

            // y = x Line (if any box is checked)
            let anyChecked = Object.values(checks).some(chk => chk.checked);
            if (anyChecked) {
                ctx.beginPath();
                ctx.strokeStyle = '#f2ae72';
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2;
                
                let x1 = -offsetX / scale;
                let y1 = -x1; 
                let x2 = (canvas.width - offsetX) / scale;
                let y2 = -x2;
                
                ctx.moveTo(offsetX + (x1 * scale), offsetY + (y1 * scale));
                ctx.lineTo(offsetX + (x2 * scale), offsetY + (y2 * scale));
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // Curve Drawer
        function drawCurve(func, color, width, minT, maxT, isInverse = false, isGhost = false) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;

            let firstPoint = true;
            
            const screenMinX = -offsetX / scale;
            const screenMaxX = (canvas.width - offsetX) / scale;
            
            let start = isGhost ? screenMinX - 1 : minT;
            let end = isGhost ? screenMaxX + 1 : maxT;
            
            if(isInverse && !isGhost) {
                start = Math.max(start, minT);
                end = Math.min(end, maxT);
            }

            const step = (end - start) / 500; 

            for (let i = start; i <= end; i += step) {
                let val = func(i);
                
                // Asymptote jumps
                if (Math.abs(val) > 50) {
                    firstPoint = true;
                    continue;
                }

                let x = isInverse ? val : i;
                let y = isInverse ? i : val;
                
                let canvasX = offsetX + (x * scale);
                let canvasY = offsetY - (y * scale);

                if (isGhost && !isInverse && i >= minT && i <= maxT) {
                    firstPoint = true;
                    continue;
                }

                if (firstPoint) {
                    ctx.moveTo(canvasX, canvasY);
                    firstPoint = false;
                } else {
                    ctx.lineTo(canvasX, canvasY);
                }
            }
            ctx.stroke();
        }

        function draw() {
            drawAxes();
            
            let infoHTML = "";

            // Draw Main Functions
            ['sin', 'cos', 'tan', 'cot'].forEach(f => {
                if (checks[f].checked) {
                    const data = funcData[f];
                    drawCurve(data.func, 'rgba(166, 184, 199, 0.3)', 2, data.rMin, data.rMax, false, true);
                    // Use a distinct color for main functions (#4a6572 - Dark Blue/Grey)
                    drawCurve(data.func, '#4a6572', 3, data.rMin, data.rMax, false, false);
                    
                    infoHTML += `<div style="margin-bottom:10px;">
                        <span class="main-val">${data.name} Restriction:</span><br>
                        Domain: ${data.dom} | Range: ${data.rng}
                    </div>`;
                }
            });

            // Draw Inverse (Arc) Functions
            ['asin', 'acos', 'atan', 'acot'].forEach(f => {
                if (checks[f].checked) {
                    const data = funcData[f];
                    // Use a distinct color for arc functions (#d96459 - Red/Orange)
                    drawCurve(data.func, '#d96459', 3, data.rMin, data.rMax, true, false);
                    
                    infoHTML += `<div style="margin-bottom:10px;">
                        <span class="inv-val">${data.name}:</span><br>
                        Domain: ${data.dom} | Range: ${data.rng}
                    </div>`;
                }
            });

            if (infoHTML === "") {
                infoBox.innerHTML = "<span style='color:#7a8b94; font-style:italic;'>Please select at least one function from above.</span>";
            } else {
                infoBox.innerHTML = infoHTML;
            }
        }

        Object.values(checks).forEach(chk => {
            chk.addEventListener('change', draw);
        });

        setTimeout(() => {
            resizeCanvas();
        }, 100);

    </script>
</body>
</html>
