<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozan Okkıran - Interactive Math Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-8 lg:p-16 text-slate-800">
    <div class="max-w-5xl mx-auto">
        
        <!-- Üst Başlık (Portfolio Header) -->
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-semibold text-slate-800 mb-3">Interactive Mathematics Laboratory</h1>
            <p class="text-slate-500 text-lg">Dynamic visualizers and conceptual models for IB DP Mathematics HL</p>
            <div class="mt-4 inline-block px-4 py-1 bg-indigo-50 border border-indigo-100 rounded-full text-indigo-600 text-sm font-medium">
                Developed by Ozan Okkıran
            </div>
        </header>

        <!-- Yükleniyor Uyarısı -->
        <div id="loading" class="text-center text-slate-400 py-10 animate-pulse">
            Fetching simulations from repository...
        </div>

        <!-- Dinamik Kartların Dizileceği Izgara (Grid) -->
        <div id="sim-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JavaScript burayı otomatik dolduracak -->
        </div>

    </div>

    <script>
        // GitHub API Ayarları
        const repoOwner = 'ozanokkiran';
        const repoName = 'ozanokkiran.github.io'; 

        async function fetchSimulations() {
            try {
                // GitHub API üzerinden depodaki dosyaları çek
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/`);
                const data = await response.json();

                const grid = document.getElementById('sim-grid');
                document.getElementById('loading').style.display = 'none';

                // Sadece .html dosyalarını filtrele (index.html hariç)
                const htmlFiles = data.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');

                if(htmlFiles.length === 0) {
                    grid.innerHTML = '<p class="text-slate-500 col-span-3 text-center">No simulations found yet.</p>';
                    return;
                }

                // Her bir HTML dosyası için ekrana pastel bir kart çiz
                htmlFiles.forEach(file => {
                    
                    // Dosya adını temizle (örn: normal_distribution.html -> Normal Distribution)
                    let title = file.name.replace('.html', '');
                    title = title.replace(/[-_]/g, ' ');
                    title = title.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');

                    const card = document.createElement('a');
                    card.href = file.name;
                    card.className = "block bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md hover:border-teal-300 transition-all duration-300 group";
                    
                    card.innerHTML = `
                        <div class="w-12 h-12 bg-teal-50 rounded-xl flex items-center justify-center mb-5 group-hover:bg-teal-100 transition-colors">
                            <svg class="w-6 h-6 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <h2 class="text-xl font-semibold text-slate-700 group-hover:text-teal-700 mb-2">${title}</h2>
                        <p class="text-sm text-slate-400 group-hover:text-slate-500 transition-colors">Launch interactive laboratory &rarr;</p>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                document.getElementById('loading').innerHTML = '<span class="text-red-400">Failed to load repository data.</span>';
            }
        }

        // Sayfa açıldığında fonksiyonu çalıştır
        fetchSimulations();
    </script>
</body>
</html>
