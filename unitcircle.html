<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Circle Explorer | Ozan Okkıran</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
            --primary: #5d8aa8;
            --accent: #e07a5f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
        }
        h1 { font-weight: 300; margin-bottom: 0.2rem; }
        p.subtitle { color: #7f8c8d; margin-top: 0; margin-bottom: 2rem; font-style: italic; }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 650px;
            width: 100%;
        }
        canvas {
            border: 1px solid #eaeaea;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            background-color: #fafafa;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }
        .angle-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 500;
            width: 100%;
            position: relative;
        }
        input[type=number] {
            width: 85px;
            padding: 8px 10px;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            border: 2px solid #eaeaea;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type=number]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(93, 138, 168, 0.2);
        }
        /* Esas Ölçü Göstergesi */
        .principal-badge {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: bold;
            margin-left: 5px;
            font-style: italic;
            opacity: 0; /* Başlangıçta gizli */
            transition: opacity 0.3s ease;
        }
        .principal-badge.visible {
            opacity: 1;
        }
        input[type=range] { 
            width: 100%; 
            margin: 25px 0; 
            cursor: pointer; 
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            width: 100%;
            font-size: 1.1rem;
            background: #f9fbfd;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eef2f5;
            text-align: center;
        }
        .stat-value { font-weight: bold; font-size: 1.4rem; margin-top: 8px; }
        .cos-val { color: var(--primary); }
        .sin-val { color: var(--accent); }
        .angle-val { color: #555; }
        .back-link { margin-top: 25px; color: var(--primary); text-decoration: none; font-weight: 500;}
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Unit Circle Explorer</h1>
    <p class="subtitle">Connecting Angles, Coordinates, and Trigonometric Functions</p>

    <div class="container">
        <canvas id="mathCanvas" width="500" height="500"></canvas>
        
        <div class="controls">
            <div class="angle-control">
                <label for="angleInput">Angle (&theta;) = </label>
                <input type="number" id="angleInput" value="45">
                <span>&deg;</span>
                <span id="principalBadge" class="principal-badge">&rarr; 45&deg;</span>
            </div>
            
            <input type="range" id="angleSlider" min="0" max="360" value="45">
            
            <div class="stats">
                <div>
                    <div>Angle (Rad)</div>
                    <div class="stat-value angle-val" id="radDisplay">&pi;/4</div>
                </div>
                <div>
                    <div>cos(&theta;) [x]</div>
                    <div class="stat-value cos-val" id="cosDisplay">0.707</div>
                </div>
                <div>
                    <div>sin(&theta;) [y]</div>
                    <div class="stat-value sin-val" id="sinDisplay">0.707</div>
                </div>
            </div>
        </div>
    </div>
    <a href="index.html" class="back-link">&larr; Back to Portfolio</a>

    <script>
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');
        const angleSlider = document.getElementById('angleSlider');
        const angleInput = document.getElementById('angleInput');
        const principalBadge = document.getElementById('principalBadge');
        
        const radDisplay = document.getElementById('radDisplay');
        const cosDisplay = document.getElementById('cosDisplay');
        const sinDisplay = document.getElementById('sinDisplay');

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = 200;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let degrees = parseInt(angleInput.value) || 0; 
            
            // Esas Ölçü (Principal Angle) Hesaplama: Negatifleri de doğru kapsar
            let principal = ((degrees % 360) + 360) % 360;
            
            // Eğer girilen açı 0-359 aralığında değilse esas ölçüyü göster
            if (degrees !== principal) {
                principalBadge.innerHTML = `&rarr; ${principal}&deg;`;
                principalBadge.classList.add('visible');
            } else {
                principalBadge.classList.remove('visible');
            }

            // Matematiksel işlemler her zaman esas ölçü üzerinden yapılsın
            let radians = principal * (Math.PI / 180);
            
            let cosVal = Math.cos(radians);
            let sinVal = Math.sin(radians);
            
            let px = cx + cosVal * radius;
            let py = cy - sinVal * radius; 

            // 1. Eksenler
            ctx.beginPath();
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
            ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
            ctx.stroke();

            // 2. Birim Çember
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(93, 138, 168, 0.05)';
            ctx.fill();
            ctx.strokeStyle = '#5d8aa8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 3. Açı (Yay)
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius * 0.2, 0, -radians, false);
            ctx.fillStyle = 'rgba(224, 122, 95, 0.3)';
            ctx.fill();

            // 4. İzdüşümler (Üçgen)
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(px, cy);
            ctx.strokeStyle = '#5d8aa8';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(px, cy);
            ctx.lineTo(px, py);
            ctx.strokeStyle = '#e07a5f';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 5. Hipotenüs
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(px, py);
            ctx.strokeStyle = '#4a4a4a';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 6. Nokta
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#2c3e50';
            ctx.fill();

            // Değerleri Göster
            // Radyan gösterimini de esas ölçüye göre sabitledik
            let frac = (principal / 180).toFixed(2);
            radDisplay.innerHTML = (frac == 1.00) ? "&pi;" : (frac == 0.00) ? "0" : frac + "&pi;";
            
            cosDisplay.innerText = (Math.abs(cosVal) < 1e-10 ? 0 : cosVal).toFixed(3);
            sinDisplay.innerText = (Math.abs(sinVal) < 1e-10 ? 0 : sinVal).toFixed(3);
        }

        angleSlider.addEventListener('input', (e) => {
            angleInput.value = e.target.value;
            draw();
        });

        angleInput.addEventListener('input', (e) => {
            let val = parseInt(e.target.value) || 0;
            // Kaydırıcıyı esas ölçüye sabitle ki saçmalamasın
            angleSlider.value = ((val % 360) + 360) % 360; 
            draw();
        });

        draw();
    </script>
</body>
</html>
