<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematics Lab: Projectile Motion</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4a6572;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #7a8b94;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 260px;
            background-color: #f4f6f8;
            padding: 20px;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            color: #4a6572;
            margin-bottom: 5px;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }
        .value-display {
            font-size: 13px;
            color: #d96459;
            font-weight: bold;
            align-self: flex-end;
        }
        canvas {
            background-color: #eef2f5;
            border-radius: 8px;
            border: 1px solid #dce3e8;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        button {
            flex: 1;
            background-color: #5b9aa0;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover:not(:disabled) {
            background-color: #4a8288;
        }
        button:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }
        #pauseBtn {
            background-color: #e59866;
        }
        #pauseBtn:hover:not(:disabled) {
            background-color: #d35400;
        }
        .stats {
            margin-top: 10px;
            padding: 12px;
            background: #fff;
            border-left: 4px solid #f2ae72;
            font-size: 13px;
            line-height: 1.5;
        }
        .stats-header {
            color: #4a6572;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        hr.divider {
            border: 0;
            border-top: 1px solid #edf2f7;
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <h1>Interactive Kinematics</h1>
    <p class="subtitle">Parametric Equations of Projectile Motion</p>

    <div class="container">
        <!-- Controls Panel -->
        <div class="controls">
            <div class="control-group">
                <label for="velocity">Initial Velocity (v₀):</label>
                <input type="range" id="velocity" min="10" max="100" value="60">
                <span class="value-display" id="vel-val">60 m/s</span>
            </div>
            
            <div class="control-group">
                <label for="angle">Launch Angle (θ):</label>
                <input type="range" id="angle" min="0" max="90" value="45">
                <span class="value-display" id="ang-val">45°</span>
            </div>

            <div class="control-group">
                <label for="gravity">Gravity (g):</label>
                <input type="range" id="gravity" min="1" max="20" step="0.1" value="9.8">
                <span class="value-display" id="grav-val">9.8 m/s²</span>
            </div>

            <div class="btn-group">
                <button id="fireBtn">Launch</button>
                <button id="pauseBtn" disabled>Pause</button>
            </div>

            <div class="stats" id="stats-box">
                <div class="stats-header">Current State</div>
                Time (t): 0.00 s<br>
                Dist (x): 0.00 m<br>
                Height (y): 0.00 m
                <hr class="divider">
                <div class="stats-header">Trajectory Info</div>
                Max Height: 0.00 m<br>
                Total Range: 0.00 m
            </div>
        </div>

        <!-- Animation Canvas -->
        <canvas id="simCanvas" width="700" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Inputs
        const velInput = document.getElementById('velocity');
        const angInput = document.getElementById('angle');
        const gravInput = document.getElementById('gravity');
        const fireBtn = document.getElementById('fireBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        
        // Displays
        const velVal = document.getElementById('vel-val');
        const angVal = document.getElementById('ang-val');
        const gravVal = document.getElementById('grav-val');
        const statsBox = document.getElementById('stats-box');

        // Simulation Variables
        let animationId;
        let isAnimating = false;
        let isPaused = false;
        let time = 0;
        let v0, theta, g;
        
        // Origin point on canvas 
        const originX = 40; 
        const originY = canvas.height - 30;
        const scale = 3; 

        // Update displays on slider move
        velInput.addEventListener('input', () => velVal.textContent = `${velInput.value} m/s`);
        angInput.addEventListener('input', () => angVal.textContent = `${angInput.value}°`);
        gravInput.addEventListener('input', () => gravVal.textContent = `${gravInput.value} m/s²`);

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.strokeStyle = '#dce3e8';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#7a8b94';
            ctx.font = "12px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";

            for(let i = 0; i <= 300; i += 50) {
                let xPos = originX + (i * scale);
                ctx.moveTo(xPos, 0);
                ctx.lineTo(xPos, canvas.height);
                if (i !== 0) ctx.fillText(i + "m", xPos, originY + 8);
            }

            ctx.textAlign = "right";
            ctx.textBaseline = "middle";

            for(let j = 0; j <= 150; j += 25) {
                let yPos = originY - (j * scale);
                ctx.moveTo(0, yPos);
                ctx.lineTo(canvas.width, yPos);
                if (j !== 0) ctx.fillText(j + "m", originX - 8, yPos);
            }
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#a6b8c7';
            ctx.lineWidth = 2;
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.stroke();
            
            ctx.textAlign = "right";
            ctx.textBaseline = "top";
            ctx.fillText("0", originX - 8, originY + 8);
        }

        function drawTrajectory() {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(217, 100, 89, 0.5)'; 
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 2;

            let t = 0;
            let currentX = originX;
            let currentY = originY;

            ctx.moveTo(originX, originY);

            while (currentY <= originY && currentX <= canvas.width) {
                let x = v0 * Math.cos(theta) * t;
                let y = (v0 * Math.sin(theta) * t) - (0.5 * g * t * t);
                
                currentX = originX + (x * scale);
                currentY = originY - (y * scale);

                if (currentY <= originY) {
                    ctx.lineTo(currentX, currentY);
                }
                t += 0.05;
            }
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        function updateStats(currentX, currentY) {
            let maxHeight = Math.pow(v0 * Math.sin(theta), 2) / (2 * g);
            let maxDistance = (Math.pow(v0, 2) * Math.sin(2 * theta)) / g;
            
            // Prevent negative height display when hitting the ground
            if (currentY < 0) currentY = 0;

            statsBox.innerHTML = `
                <div class="stats-header">Current State</div>
                Time (t): <b>${time.toFixed(2)} s</b><br>
                Dist (x): <b>${currentX.toFixed(2)} m</b><br>
                Height (y): <b>${currentY.toFixed(2)} m</b>
                <hr class="divider">
                <div class="stats-header">Trajectory Info</div>
                Max Height: ${maxHeight.toFixed(2)} m<br>
                Total Range: ${maxDistance.toFixed(2)} m
            `;
        }

        function animate() {
            drawBackground();
            drawTrajectory();

            // Calculate current exact position
            let x = v0 * Math.cos(theta) * time;
            let y = (v0 * Math.sin(theta) * time) - (0.5 * g * time * time);
            
            let canvasX = originX + (x * scale);
            let canvasY = originY - (y * scale);

            // Draw Particle
            ctx.beginPath();
            ctx.arc(canvasX, canvasY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#f2ae72';
            ctx.fill();
            ctx.strokeStyle = '#d96459';
            ctx.stroke();

            updateStats(x, y);

            time += 0.05; 

            // Stop if it hits the ground
            if (canvasY >= originY && time > 0.1) {
                isAnimating = false;
                pauseBtn.disabled = true;
                pauseBtn.textContent = "Pause";
                cancelAnimationFrame(animationId);
                // Snap to final ground state for accuracy
                let maxDist = (Math.pow(v0, 2) * Math.sin(2 * theta)) / g;
                let totalTime = (2 * v0 * Math.sin(theta)) / g;
                time = totalTime;
                updateStats(maxDist, 0);
            } else {
                animationId = requestAnimationFrame(animate);
            }
        }

        fireBtn.addEventListener('click', () => {
            if (isAnimating) cancelAnimationFrame(animationId);
            
            v0 = parseFloat(velInput.value);
            theta = parseFloat(angInput.value) * (Math.PI / 180); 
            g = parseFloat(gravInput.value);
            
            time = 0;
            isAnimating = true;
            isPaused = false;
            
            pauseBtn.disabled = false;
            pauseBtn.textContent = "Pause";
            pauseBtn.style.backgroundColor = "#e59866";
            
            animate();
        });

        pauseBtn.addEventListener('click', () => {
            if (!isAnimating && !isPaused) return; // Ignore if haven't launched

            isPaused = !isPaused;
            
            if (isPaused) {
                cancelAnimationFrame(animationId);
                pauseBtn.textContent = "Resume";
                pauseBtn.style.backgroundColor = "#5b9aa0";
            } else {
                pauseBtn.textContent = "Pause";
                pauseBtn.style.backgroundColor = "#e59866";
                animate();
            }
        });

        // Initial Draw
        drawBackground();
    </script>
</body>
</html>
