<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Vector Laboratory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 text-slate-800">

    <div class="max-w-6xl w-full bg-white rounded-2xl shadow-sm border border-slate-100 p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Panel: Controls -->
        <div class="lg:col-span-5 flex flex-col justify-center space-y-6">
            <div>
                <h1 class="text-3xl font-semibold text-slate-800 mb-2">3D Vector Laboratory</h1>
                <p class="text-slate-500 text-sm">Visualizing vector movement, addition, and cross product in 3D space.</p>
            </div>

            <!-- Vector u Inputs -->
            <div class="bg-teal-50/50 p-4 rounded-xl border border-teal-100">
                <div class="text-sm font-semibold text-teal-700 mb-3 flex items-center">
                    <span class="w-3 h-3 rounded-full bg-teal-400 mr-2"></span>
                    Vector u (Teal)
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">X axis (i)</label>
                        <input type="number" id="ux" value="3" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-slate-700 focus:outline-none focus:border-teal-400">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">Y axis (j)</label>
                        <input type="number" id="uy" value="1" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-slate-700 focus:outline-none focus:border-teal-400">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">Z axis (k)</label>
                        <input type="number" id="uz" value="2" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-slate-700 focus:outline-none focus:border-teal-400">
                    </div>
                </div>
            </div>

            <!-- Vector v Inputs -->
            <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-100">
                <div class="text-sm font-semibold text-amber-700 mb-3 flex items-center">
                    <span class="w-3 h-3 rounded-full bg-amber-400 mr-2"></span>
                    Vector v (Amber)
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">X axis (i)</label>
                        <input type="number" id="vx" value="-1" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-slate-700 focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">Y axis (j)</label>
                        <input type="number" id="vy" value="4" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-slate-700 focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">Z axis (k)</label>
                        <input type="number" id="vz" value="1" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-slate-700 focus:outline-none focus:border-amber-400">
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button id="btn-add" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-semibold py-3 rounded-xl transition-colors duration-200">
                    u + v (Addition)
                </button>
                <button id="btn-cross" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold py-3 rounded-xl transition-colors duration-200">
                    u × v (Cross Prod.)
                </button>
            </div>
            
            <button id="btn-reset" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 rounded-xl transition-colors duration-200">
                Show Base Vectors Only
            </button>

            <!-- Result Box -->
            <div id="result-box" class="hidden bg-slate-800 p-4 rounded-xl text-white mt-4 border-l-4 border-slate-500 shadow-md">
                <div class="text-xs text-slate-400 mb-1" id="result-title">Result</div>
                <div class="text-lg font-mono" id="result-formula">w = (0, 0, 0)</div>
            </div>
        </div>

        <!-- Right Panel: 3D Plotly Canvas -->
        <div class="lg:col-span-7 flex justify-center items-center relative min-h-[500px]">
            <div class="w-full h-full rounded-2xl overflow-hidden border border-slate-200 shadow-inner bg-slate-50/50 relative" id="plot-container">
                <!-- Plotly render target -->
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const btnAdd = document.getElementById('btn-add');
        const btnCross = document.getElementById('btn-cross');
        const btnReset = document.getElementById('btn-reset');
        const resultBox = document.getElementById('result-box');
        const resultTitle = document.getElementById('result-title');
        const resultFormula = document.getElementById('result-formula');

        function getInputs() {
            return {
                u: {
                    x: parseFloat(document.getElementById('ux').value) || 0,
                    y: parseFloat(document.getElementById('uy').value) || 0,
                    z: parseFloat(document.getElementById('uz').value) || 0
                },
                v: {
                    x: parseFloat(document.getElementById('vx').value) || 0,
                    y: parseFloat(document.getElementById('vy').value) || 0,
                    z: parseFloat(document.getElementById('vz').value) || 0
                }
            };
        }

        // Plotly Draw Function
        function drawVectors(resultVector = null, type = null) {
            const { u, v } = getInputs();
            
            // Base Vectors (u and v)
            let traces = [
                {
                    x: [0, u.x], y: [0, u.y], z: [0, u.z],
                    mode: 'lines+markers',
                    name: 'Vector u',
                    line: {color: '#2dd4bf', width: 8}, // Teal
                    marker: {size: [0, 6], color: '#2dd4bf'},
                    type: 'scatter3d'
                },
                {
                    x: [0, v.x], y: [0, v.y], z: [0, v.z],
                    mode: 'lines+markers',
                    name: 'Vector v',
                    line: {color: '#fbbf24', width: 8}, // Amber
                    marker: {size: [0, 6], color: '#fbbf24'},
                    type: 'scatter3d'
                }
            ];

            // Append result vector if exists
            if (resultVector) {
                let color = type === 'add' ? '#818cf8' : '#fb7185'; // Add: Indigo, Cross: Rose
                let name = type === 'add' ? 'u + v' : 'u × v';
                
                traces.push({
                    x: [0, resultVector.x], y: [0, resultVector.y], z: [0, resultVector.z],
                    mode: 'lines+markers',
                    name: name,
                    line: {color: color, width: 8},
                    marker: {size: [0, 6], color: color},
                    type: 'scatter3d'
                });
            }

            // 3D Scene Layout (Preserving orthogonal aspect ratio)
            let layout = {
                margin: { l: 0, r: 0, b: 0, t: 0 },
                scene: {
                    aspectmode: 'data', 
                    xaxis: { title: 'X', showbackground: true, backgroundcolor: '#f8fafc', gridcolor: '#e2e8f0', zerolinecolor: '#94a3b8' },
                    yaxis: { title: 'Y', showbackground: true, backgroundcolor: '#f8fafc', gridcolor: '#e2e8f0', zerolinecolor: '#94a3b8' },
                    zaxis: { title: 'Z', showbackground: true, backgroundcolor: '#f8fafc', gridcolor: '#e2e8f0', zerolinecolor: '#94a3b8' },
                    camera: { eye: {x: 1.5, y: 1.5, z: 1.5} }
                },
                paper_bgcolor: 'transparent',
                plot_bgcolor: 'transparent',
                legend: { x: 0, y: 1 }
            };

            Plotly.newPlot('plot-container', traces, layout, {responsive: true, displayModeBar: true});
        }

        // Event Listeners
        btnAdd.addEventListener('click', () => {
            const { u, v } = getInputs();
            let res = {
                x: u.x + v.x,
                y: u.y + v.y,
                z: u.z + v.z
            };
            drawVectors(res, 'add');
            
            resultBox.classList.remove('hidden');
            resultBox.classList.replace('border-rose-400', 'border-indigo-400');
            resultTitle.innerText = "Addition Vector (u + v)";
            resultFormula.innerHTML = `w = (${res.x})<span class="text-indigo-300">i</span> + (${res.y})<span class="text-indigo-300">j</span> + (${res.z})<span class="text-indigo-300">k</span>`;
        });

        btnCross.addEventListener('click', () => {
            const { u, v } = getInputs();
            // Cross Product Formula
            let res = {
                x: (u.y * v.z) - (u.z * v.y),
                y: (u.z * v.x) - (u.x * v.z),
                z: (u.x * v.y) - (u.y * v.x)
            };
            drawVectors(res, 'cross');
            
            resultBox.classList.remove('hidden');
            resultBox.classList.replace('border-indigo-400', 'border-rose-400');
            resultTitle.innerText = "Cross Product (u × v) - ORTHOGONAL(90°) to both vectors";
            resultFormula.innerHTML = `w = (${res.x})<span class="text-rose-300">i</span> + (${res.y})<span class="text-rose-300">j</span> + (${res.z})<span class="text-rose-300">k</span>`;
        });

        btnReset.addEventListener('click', () => {
            drawVectors();
            resultBox.classList.add('hidden');
        });

        // Auto-update drawing on input change
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', () => {
                btnReset.click(); 
            });
        });

        // Initial render
        window.onload = () => {
            drawVectors();
        };
    </script>
</body>
</html>
