<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quadratic Explorer</title>
    <style>
        :root {
            --bg-color: #fdf8e9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #555555;
            --accent-blue: #1e88e5;
            --curve-color: #38b29e;
            --vertex-color: #e91e63;
            --grid-line: #ececec;
            --axis-line: #666666;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            color: var(--text-main);
            font-size: 2.2rem;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            padding: 25px;
            border: 1px solid var(--border-color);
        }

        .slider-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-header {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .var-label {
            width: 25px;
        }

        input[type="number"] {
            padding: 4px 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            width: 80px;
            text-align: center;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            background: #dcdde1;
            border-radius: 3px;
            outline: none;
            margin-top: 10px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
        }

        .right-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .equation-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-blue);
            font-family: 'Cambria Math', 'Times New Roman', serif;
        }

        .vertex-display {
            font-size: 1.2rem;
            color: var(--vertex-color);
            font-weight: 500;
            margin-bottom: 10px;
        }

        .canvas-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            position: relative;
        }

        .zoom-hint {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            pointer-events: none;
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        canvas {
            display: block;
            width: 100%;
            height: 500px;
            cursor: crosshair;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Interactive Quadratic Explorer</h1>
        <div class="subtitle">Adjust the coefficients to see how the parabola <b>y = ax² + bx + c</b> changes.</div>
    </div>

    <div class="main-container">
        
        <div class="left-panel">
            <div class="control-card">
                
                <div class="slider-group">
                    <div class="slider-header">
                        <span class="var-label">a:</span>
                        <input type="number" id="aInput" min="-30" max="30" step="0.1" value="0.2">
                    </div>
                    <input type="range" id="aSlider" min="-30" max="30" step="0.1" value="0.2">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <span class="var-label">b:</span>
                        <input type="number" id="bInput" min="-30" max="30" step="0.1" value="0.0">
                    </div>
                    <input type="range" id="bSlider" min="-30" max="30" step="0.1" value="0.0">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <span class="var-label">c:</span>
                        <input type="number" id="cInput" min="-30" max="30" step="0.1" value="0.0">
                    </div>
                    <input type="range" id="cSlider" min="-30" max="30" step="0.1" value="0.0">
                </div>

            </div>
        </div>

        <div class="right-panel">
            <div class="equation-display" id="eqDisplay">y = 0.2x² + 0.0x + 0.0</div>
            <div class="vertex-display" id="vertexDisplay">Vertex: (0.00, 0.00)</div>
            
            <div class="canvas-container">
                <div class="zoom-hint">Scroll to Zoom | Drag to Pan</div>
                <canvas id="quadCanvas" width="700" height="500"></canvas>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('quadCanvas');
        const ctx = canvas.getContext('2d');
        
        const aInput = document.getElementById('aInput');
        const bInput = document.getElementById('bInput');
        const cInput = document.getElementById('cInput');
        
        const aSlider = document.getElementById('aSlider');
        const bSlider = document.getElementById('bSlider');
        const cSlider = document.getElementById('cSlider');
        
        const eqDisplay = document.getElementById('eqDisplay');
        const vertexDisplay = document.getElementById('vertexDisplay');

        let xMin = -10;
        let xMax = 10;
        let yMin = -10;
        let yMax = 10;

        // --- GÜVENLİ DEĞER OKUMA (CRASH ÖNLEME) ---
        function getSafeValue(inputElement) {
            let val = parseFloat(inputElement.value);
            return isNaN(val) ? 0 : val;
        }

        // --- EKSEN KONTROLLERİ ---
        canvas.addEventListener('wheel', function(event) {
            event.preventDefault(); 
            const zoomFactor = event.deltaY < 0 ? 0.9 : 1.1; 
            
            xMin *= zoomFactor;
            xMax *= zoomFactor;
            yMin *= zoomFactor;
            yMax *= zoomFactor;
            
            if (xMax - xMin < 2) { xMin = -1; xMax = 1; }
            if (xMax - xMin > 200) { xMin = -100; xMax = 100; }
            if (yMax - yMin < 2) { yMin = -1; yMax = 1; }
            if (yMax - yMin > 200) { yMin = -100; yMax = 100; }

            draw();
        });

        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        canvas.addEventListener('mousedown', function(e) {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;

            const xRange = xMax - xMin;
            const yRange = yMax - yMin;
            const xDelta = (dx / canvas.width) * xRange;
            const yDelta = (dy / canvas.height) * yRange;

            xMin -= xDelta;
            xMax -= xDelta;
            yMin += yDelta; 
            yMax += yDelta;

            draw();
        });

        canvas.addEventListener('mouseup', function() {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });
        canvas.addEventListener('mouseleave', function() {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });

        function mapX(x) { return ((x - xMin) / (xMax - xMin)) * canvas.width; }
        function mapY(y) { return canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height; }
        function unmapX(px) { return (px / canvas.width) * (xMax - xMin) + xMin; }

        function getGridStep(range) {
            if (range <= 4) return 0.5;
            if (range <= 10) return 1;
            if (range <= 25) return 2;
            if (range <= 50) return 5;
            if (range <= 100) return 10;
            return 20;
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.lineWidth = 1;
            ctx.font = '11px sans-serif';
            ctx.fillStyle = '#999999';

            let xStep = getGridStep(xMax - xMin);
            let yStep = getGridStep(yMax - yMin);

            let startX = Math.ceil(xMin / xStep) * xStep;
            for (let i = startX; i <= xMax; i += xStep) {
                if (Math.abs(i) < 1e-5) continue; 
                ctx.beginPath();
                ctx.strokeStyle = '#ececec';
                ctx.moveTo(mapX(i), 0);
                ctx.lineTo(mapX(i), canvas.height);
                ctx.stroke();
                
                let valStr = Number.isInteger(i) ? i.toString() : parseFloat(i.toFixed(1)).toString();
                ctx.fillText(valStr, mapX(i) - 8, mapY(0) + 15);
            }

            let startY = Math.ceil(yMin / yStep) * yStep;
            for (let i = startY; i <= yMax; i += yStep) {
                if (Math.abs(i) < 1e-5) continue; 
                ctx.beginPath();
                ctx.strokeStyle = '#ececec';
                ctx.moveTo(0, mapY(i));
                ctx.lineTo(canvas.width, mapY(i));
                ctx.stroke();
                
                let valStr = Number.isInteger(i) ? i.toString() : parseFloat(i.toFixed(1)).toString();
                ctx.fillText(valStr, mapX(0) + 5, mapY(i) + 4);
            }

            ctx.beginPath();
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 1.5;
            ctx.moveTo(0, mapY(0));
            ctx.lineTo(canvas.width, mapY(0));
            ctx.moveTo(mapX(0), 0);
            ctx.lineTo(mapX(0), canvas.height);
            ctx.stroke();
            
            ctx.fillText("0", mapX(0) + 5, mapY(0) + 15);
        }

        function formatEquation(a, b, c) {
            let eq = "y = ";
            
            if (a === 1) eq += "x² ";
            else if (a === -1) eq += "-x² ";
            else if (a !== 0) eq += a.toFixed(1) + "x² ";

            if (b > 0) eq += (a !== 0 ? "+ " : "") + (b === 1 ? "x " : b.toFixed(1) + "x ");
            else if (b < 0) eq += (a !== 0 ? "- " : "-") + (b === -1 ? "x " : Math.abs(b).toFixed(1) + "x ");
            
            if (c > 0) eq += (a !== 0 || b !== 0 ? "+ " : "") + c.toFixed(1);
            else if (c < 0) eq += (a !== 0 || b !== 0 ? "- " : "-") + Math.abs(c).toFixed(1);
            
            if (a === 0 && b === 0 && c === 0) eq = "y = 0";
            
            return eq;
        }

        function draw() {
            drawGrid();

            // Güvenli okuma
            let a = getSafeValue(aInput);
            let b = getSafeValue(bInput);
            let c = getSafeValue(cInput);

            eqDisplay.innerText = formatEquation(a, b, c);
            
            let vx = 0, vy = c;
            if (a !== 0) {
                vx = -b / (2 * a);
                vy = a * vx * vx + b * vx + c;
                vertexDisplay.innerText = `Vertex: (${vx.toFixed(2)}, ${vy.toFixed(2)})`;
                vertexDisplay.style.visibility = 'visible';
            } else {
                vertexDisplay.style.visibility = 'hidden';
            }

            ctx.beginPath();
            ctx.strokeStyle = '#38b29e'; 
            ctx.lineWidth = 3;

            let first = true;
            for (let px = 0; px <= canvas.width; px += 2) {
                let x = unmapX(px);
                let y = a * x * x + b * x + c;

                // Sonsuzluğa giden hataları önle
                if (isNaN(y) || !isFinite(y)) continue;

                let py = mapY(y);

                if (first) {
                    ctx.moveTo(px, py);
                    first = false;
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();

            if (a !== 0) {
                ctx.beginPath();
                ctx.fillStyle = '#e91e63'; 
                ctx.arc(mapX(vx), mapY(vy), 6, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // --- GÜVENLİ SENKRONİZASYON ---
        function syncInputs(slider, input) {
            slider.addEventListener('input', function() {
                input.value = parseFloat(this.value).toFixed(1);
                draw();
            });
            
            input.addEventListener('input', function() {
                let val = parseFloat(this.value);
                
                // Kullanıcı silerse veya geçersiz karakter girerse grafik çökmesin
                if(isNaN(val)) {
                    draw(); 
                    return; 
                }
                
                if (val > 30) { val = 30; this.value = 30; }
                if (val < -30) { val = -30; this.value = -30; }
                
                slider.value = val;
                draw();
            });
            
            // Kullanıcı kutudan çıkınca, içi boşsa 0'a tamamla
            input.addEventListener('blur', function() {
                if(this.value === "" || isNaN(parseFloat(this.value))) {
                    this.value = "0.0";
                    slider.value = 0;
                    draw();
                }
            });
        }

        syncInputs(aSlider, aInput);
        syncInputs(bSlider, bInput);
        syncInputs(cSlider, cInput);

        // Sayfa yüklenince ilk çizimi garantile
        window.onload = function() {
            aInput.value = "0.2"; aSlider.value = "0.2";
            bInput.value = "0.0"; bSlider.value = "0.0";
            cInput.value = "0.0"; cSlider.value = "0.0";
            draw();
        };
    </script>
</body>
</html>
