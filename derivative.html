<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derivative Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --accent-orange: #e67e22;
            --border-color: #ecf0f1;
            --grid-line: #e0e0e0;
            --axis-line: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: var(--text-main);
            font-size: 2.2rem;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-light);
            font-style: italic;
            margin-top: 5px;
        }

        .main-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            padding: 30px;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .visualization-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .canvas-container {
            flex-grow: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background-color: #fafbfc;
        }

        canvas {
            display: block;
            width: 100%;
            height: 450px;
        }

        .quick-insert-panel {
            width: 120px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quick-btn {
            background-color: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            padding: 12px 10px;
            font-size: 1.1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .quick-btn:hover {
            background-color: #eef2f5;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .input-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .function-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            width: 250px;
            transition: border-color 0.3s;
            font-family: monospace;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid var(--accent-blue);
            border-radius: 6px;
            background-color: white;
            color: var(--text-main);
            cursor: pointer;
            width: 150px;
        }

        .slider-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .slider-label {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .slider-val {
            color: var(--accent-orange);
            font-weight: bold;
        }

        input[type="range"] {
            width: 80%;
            max-width: 500px;
            -webkit-appearance: none;
            height: 6px;
            background: #dcdde1;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
        }

        .results-panel {
            display: flex;
            justify-content: space-around;
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
        }

        .result-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .result-label {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: 500;
        }
        
        .derivative-eq {
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--text-main);
            background: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px dashed var(--border-color);
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .val-fx { color: var(--accent-blue); }
        .val-slope { color: var(--accent-green); }

        .footer-link {
            margin-top: 20px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        
        .footer-link:hover {
            color: var(--accent-blue);
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Derivative Visualizer</h1>
        <div class="subtitle">Dynamic Rate of Change for Any Function</div>
    </div>

    <div class="main-container">
        
        <div class="visualization-area">
            <div class="canvas-container">
                <canvas id="graphCanvas" width="800" height="450"></canvas>
            </div>
            
            <div class="quick-insert-panel">
                <button class="quick-btn" onclick="insertText('x^2')">x²</button>
                <button class="quick-btn" onclick="insertText('x^3')">x³</button>
                <button class="quick-btn" onclick="insertText('x^4')">x⁴</button>
                <button class="quick-btn" onclick="insertText('+')">+</button>
                <button class="quick-btn" onclick="insertText('-')">-</button>
            </div>
        </div>

        <div class="input-section">
            <div class="function-input-wrapper">
                f(x) = <input type="text" id="funcInput" value="x^2 + 3x + 5">
            </div>
            <select id="presetSelect" onchange="applyPreset()">
                <option value="">Presets...</option>
                <option value="sin(x)">sin(x)</option>
                <option value="cos(x)">cos(x)</option>
                <option value="x^3 - 4x">x³ - 4x</option>
            </select>
        </div>

        <div class="slider-section">
            <div class="slider-label">Point x = <span id="xValDisplay" class="slider-val">2.00</span></div>
            <input type="range" id="xSlider" min="-10" max="10" step="0.05" value="2">
        </div>

        <div class="results-panel">
            <div class="result-box">
                <div class="result-label">Function Value f(x)</div>
                <div id="fxVal" class="result-value val-fx">15.000</div>
            </div>
            <div class="result-box">
                <div class="result-label">Derivative & Slope f'(x)</div>
                <div id="derivEq" class="derivative-eq">f'(x) = 2 * x + 3</div>
                <div id="slopeVal" class="result-value val-slope">7.000</div>
            </div>
        </div>

    </div>
    
    <a href="#" class="footer-link">&larr; Back to Portfolio</a>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const funcInput = document.getElementById('funcInput');
        const xSlider = document.getElementById('xSlider');
        const xValDisplay = document.getElementById('xValDisplay');
        const fxValDisplay = document.getElementById('fxVal');
        const slopeValDisplay = document.getElementById('slopeVal');
        const derivEqDisplay = document.getElementById('derivEq');
        const presetSelect = document.getElementById('presetSelect');

        // Viewport settings
        const xMin = -10;
        const xMax = 10;
        const yMin = -20;
        const yMax = 20;

        function insertText(text) {
            const input = funcInput;
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const currentValue = input.value;
            
            // Add a space before if it's an operator and not at the beginning
            let insertStr = text;
            if ((text === '+' || text === '-') && start > 0 && currentValue[start-1] !== ' ') {
                insertStr = ' ' + text + ' ';
            }
            
            input.value = currentValue.slice(0, start) + insertStr + currentValue.slice(end);
            
            // Move cursor after inserted text
            const newPos = start + insertStr.length;
            input.focus();
            input.setSelectionRange(newPos, newPos);
            draw();
        }

        function applyPreset() {
            if(presetSelect.value !== "") {
                funcInput.value = presetSelect.value;
                draw();
            }
        }

        function mapX(x) {
            return ((x - xMin) / (xMax - xMin)) * canvas.width;
        }

        function mapY(y) {
            return canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height;
        }
        
        function unmapX(px) {
            return (px / canvas.width) * (xMax - xMin) + xMin;
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.lineWidth = 1;
            ctx.font = '10px sans-serif';
            ctx.fillStyle = '#95a5a6';

            // Draw grid and numbers
            for (let i = xMin; i <= xMax; i++) {
                if (i === 0) continue;
                ctx.beginPath();
                ctx.strokeStyle = var(--grid-line);
                ctx.moveTo(mapX(i), 0);
                ctx.lineTo(mapX(i), canvas.height);
                ctx.stroke();
                
                // X-axis numbers
                if(i % 2 === 0) {
                    ctx.fillText(i, mapX(i) - 5, mapY(0) + 15);
                }
            }

            for (let i = yMin; i <= yMax; i += 2) {
                if (i === 0) continue;
                ctx.beginPath();
                ctx.strokeStyle = var(--grid-line);
                ctx.moveTo(0, mapY(i));
                ctx.lineTo(canvas.width, mapY(i));
                ctx.stroke();
                
                // Y-axis numbers
                if(i % 5 === 0) {
                    ctx.fillText(i, mapX(0) + 5, mapY(i) + 4);
                }
            }

            // Draw main axes
            ctx.beginPath();
            ctx.strokeStyle = var(--axis-line);
            ctx.lineWidth = 1.5;
            ctx.moveTo(0, mapY(0));
            ctx.lineTo(canvas.width, mapY(0));
            ctx.moveTo(mapX(0), 0);
            ctx.lineTo(mapX(0), canvas.height);
            ctx.stroke();
        }

        function draw() {
            drawGrid();

            const exprStr = funcInput.value;
            let currentX = parseFloat(xSlider.value);
            xValDisplay.innerText = currentX.toFixed(2);

            try {
                const node = math.parse(exprStr);
                const code = node.compile();
                
                // Calculate Analytical Derivative
                const xNode = math.parse('x');
                const derivativeNode = math.derivative(node, xNode);
                const derivativeCode = derivativeNode.compile();
                
                // Display derivative equation
                derivEqDisplay.innerText = "f'(x) = " + derivativeNode.toString();

                // Draw function curve
                ctx.beginPath();
                ctx.strokeStyle = '#5c8aab'; // Soft blue/gray
                ctx.lineWidth = 2.5;

                let first = true;
                for (let px = 0; px <= canvas.width; px += 2) {
                    let x = unmapX(px);
                    let y = code.evaluate({ x: x });

                    if (isNaN(y) || !isFinite(y)) continue;

                    let py = mapY(y);

                    if (first) {
                        ctx.moveTo(px, py);
                        first = false;
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.stroke();

                // Current point values
                let currentY = code.evaluate({ x: currentX });
                let slope = derivativeCode.evaluate({ x: currentX });

                fxValDisplay.innerText = currentY.toFixed(3);
                slopeValDisplay.innerText = slope.toFixed(3);

                // Draw tangent line
                const tangentLength = 4; // Length in graph units
                const x1 = currentX - tangentLength;
                const y1 = currentY - slope * tangentLength;
                const x2 = currentX + tangentLength;
                const y2 = currentY + slope * tangentLength;

                ctx.beginPath();
                ctx.strokeStyle = '#27ae60'; // Green
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.moveTo(mapX(x1), mapY(y1));
                ctx.lineTo(mapX(x2), mapY(y2));
                ctx.stroke();
                ctx.setLineDash([]); // Reset dash

                // Draw dot at current point
                ctx.beginPath();
                ctx.fillStyle = '#e67e22'; // Orange
                ctx.arc(mapX(currentX), mapY(currentY), 6, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

            } catch (error) {
                // If expression is invalid while typing
                fxValDisplay.innerText = '---';
                slopeValDisplay.innerText = '---';
                derivEqDisplay.innerText = "Invalid Expression";
            }
        }

        // Add CSS variables to window for JS access
        document.documentElement.style.setProperty('--grid-line', '#ecf0f1');
        document.documentElement.style.setProperty('--axis-line', '#bdc3c7');

        funcInput.addEventListener('input', draw);
        xSlider.addEventListener('input', draw);

        // Initial draw
        draw();
    </script>
</body>
</html>
