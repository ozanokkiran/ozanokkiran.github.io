<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derivative Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --accent-orange: #e67e22;
            --border-color: #ecf0f1;
            --grid-line: #ecf0f1;
            --axis-line: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: var(--text-main);
            font-size: 2.2rem;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-light);
            font-style: italic;
            margin-top: 5px;
        }

        .main-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            padding: 30px;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .visualization-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .canvas-container {
            flex-grow: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background-color: #fafbfc;
            position: relative;
        }

        .zoom-hint {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            pointer-events: none;
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        canvas {
            display: block;
            width: 100%;
            height: 450px;
            cursor: crosshair; 
        }

        .quick-insert-panel {
            width: 120px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quick-btn {
            background-color: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            padding: 12px 10px;
            font-size: 1.1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .quick-btn:hover {
            background-color: #eef2f5;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .input-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .function-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            width: 250px;
            transition: border-color 0.3s;
            font-family: monospace;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid var(--accent-blue);
            border-radius: 6px;
            background-color: white;
            color: var(--text-main);
            cursor: pointer;
            width: 150px;
        }

        .slider-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .slider-label {
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        input[type="number"] {
            padding: 4px 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-orange);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            width: 90px;
            text-align: center;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-orange);
        }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        input[type="range"] {
            width: 80%;
            max-width: 500px;
            -webkit-appearance: none;
            height: 6px;
            background: #dcdde1;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
        }

        .results-panel {
            display: flex;
            justify-content: space-around;
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
        }

        .result-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .result-label {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: 500;
        }
        
        .derivative-eq {
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--text-main);
            background: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px dashed var(--border-color);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .derivative-eq sup {
            font-size: 0.8rem;
            line-height: 0;
            position: relative;
            top: -0.4em;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .val-fx { color: var(--accent-blue); }
        .val-slope { color: var(--accent-green); }

        .footer-link {
            margin-top: 20px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        
        .footer-link:hover {
            color: var(--accent-blue);
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Derivative Visualizer</h1>
        <div class="subtitle">Dynamic Rate of Change for Any Function</div>
    </div>

    <div class="main-container">
        
        <div class="visualization-area">
            <div class="canvas-container">
                <div class="zoom-hint">Scroll to Zoom | Drag to Pan</div>
                <canvas id="graphCanvas" width="800" height="450"></canvas>
            </div>
            
            <div class="quick-insert-panel">
                <button class="quick-btn" onclick="insertText('x^2')">x²</button>
                <button class="quick-btn" onclick="insertText('x^3')">x³</button>
                <button class="quick-btn" onclick="insertText('x^4')">x⁴</button>
                <button class="quick-btn" onclick="insertText('+')">+</button>
                <button class="quick-btn" onclick="insertText('-')">-</button>
            </div>
        </div>

        <div class="input-section">
            <div class="function-input-wrapper">
                f(x) = <input type="text" id="funcInput" value="x^3 + 2x^2 + x + 1">
            </div>
            <select id="presetSelect" onchange="applyPreset()">
                <option value="">Presets...</option>
                <option value="sin(x)">sin(x)</option>
                <option value="cos(x)">cos(x)</option>
                <option value="x^3 - 4x">x³ - 4x</option>
            </select>
        </div>

        <div class="slider-section">
            <div class="slider-label">
                Point x = 
                <input type="number" id="xInputBox" min="-50" max="50" step="0.01" value="1.00">
            </div>
            <input type="range" id="xSlider" min="-10" max="10" step="0.05" value="1.00">
        </div>

        <div class="results-panel">
            <div class="result-box">
                <div class="result-label">Function Value f(x)</div>
                <div id="fxVal" class="result-value val-fx">0</div>
            </div>
            <div class="result-box">
                <div class="result-label">Derivative f'(x)</div>
                <div id="derivEq" class="derivative-eq">f'(x) = </div>
                <div id="slopeVal" class="result-value val-slope">Slope = 0</div>
            </div>
        </div>

    </div>
    
    <a href="#" class="footer-link">&larr; Back to Portfolio</a>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const funcInput = document.getElementById('funcInput');
        const xSlider = document.getElementById('xSlider');
        const xInputBox = document.getElementById('xInputBox');
        const fxValDisplay = document.getElementById('fxVal');
        const slopeValDisplay = document.getElementById('slopeVal');
        const derivEqDisplay = document.getElementById('derivEq');
        const presetSelect = document.getElementById('presetSelect');

        let xMin = -10;
        let xMax = 10;
        let yMin = -20;
        let yMax = 20;

        canvas.addEventListener('wheel', function(event) {
            event.preventDefault(); 
            const zoomFactor = event.deltaY < 0 ? 0.9 : 1.1; 
            
            xMin *= zoomFactor;
            xMax *= zoomFactor;
            yMin *= zoomFactor;
            yMax *= zoomFactor;
            
            if (xMax - xMin < 2) { xMin = -1; xMax = 1; }
            if (xMax - xMin > 200) { xMin = -100; xMax = 100; }
            if (yMax - yMin < 4) { yMin = -2; yMax = 2; }
            if (yMax - yMin > 400) { yMin = -200; yMax = 200; }

            xSlider.min = Math.floor(xMin);
            xSlider.max = Math.ceil(xMax);

            draw();
        });

        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        canvas.addEventListener('mousedown', function(e) {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;

            const xRange = xMax - xMin;
            const yRange = yMax - yMin;
            const xDelta = (dx / canvas.width) * xRange;
            const yDelta = (dy / canvas.height) * yRange;

            xMin -= xDelta;
            xMax -= xDelta;
            yMin += yDelta; 
            yMax += yDelta;

            xSlider.min = Math.floor(xMin);
            xSlider.max = Math.ceil(xMax);

            draw();
        });

        canvas.addEventListener('mouseup', function() {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });

        canvas.addEventListener('mouseleave', function() {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });

        // Matematiksel ifadeleri HTML formatına çevir (Üslü sayılar için)
        function formatMathToHTML(exprStr) {
            return exprStr
                .replace(/(\d+)\s*\*\s*([a-zA-Z])/g, '$1$2') // 2 * x -> 2x
                .replace(/\s*\*\s*/g, '*')                   // a * b -> a*b
                .replace(/\s*\^\s*/g, '^')                   // x ^ 3 -> x^3
                .replace(/\^([0-9]+)/g, '<sup>$1</sup>');    // x^3 -> x<sup>3</sup>
        }

        // Akıllı Sayı Formatı
        function formatNumber(num) {
            return parseFloat(num.toFixed(3)).toString();
        }

        function insertText(text) {
            const input = funcInput;
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const currentValue = input.value;
            
            let insertStr = text;
            if ((text === '+' || text === '-') && start > 0 && currentValue[start-1] !== ' ') {
                insertStr = ' ' + text + ' ';
            }
            
            input.value = currentValue.slice(0, start) + insertStr + currentValue.slice(end);
            
            const newPos = start + insertStr.length;
            input.focus();
            input.setSelectionRange(newPos, newPos);
            draw();
        }

        function applyPreset() {
            if(presetSelect.value !== "") {
                funcInput.value = presetSelect.value;
                draw();
            }
        }

        function mapX(x) { return ((x - xMin) / (xMax - xMin)) * canvas.width; }
        function mapY(y) { return canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height; }
        function unmapX(px) { return (px / canvas.width) * (xMax - xMin) + xMin; }

        function getGridStep(range) {
            if (range <= 4) return 0.5;
            if (range <= 10) return 1;
            if (range <= 25) return 2;
            if (range <= 50) return 5;
            if (range <= 100) return 10;
            return 20;
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.lineWidth = 1;
            ctx.font = '11px sans-serif';
            ctx.fillStyle = '#95a5a6';

            let xStep = getGridStep(xMax - xMin);
            let yStep = getGridStep(yMax - yMin);

            let startX = Math.ceil(xMin / xStep) * xStep;
            for (let i = startX; i <= xMax; i += xStep) {
                if (Math.abs(i) < 1e-5) continue; 
                ctx.beginPath();
                ctx.strokeStyle = '#ecf0f1';
                ctx.moveTo(mapX(i), 0);
                ctx.lineTo(mapX(i), canvas.height);
                ctx.stroke();
                
                let valStr = Number.isInteger(i) ? i.toString() : parseFloat(i.toFixed(1)).toString();
                ctx.fillText(valStr, mapX(i) - 8, mapY(0) + 15);
            }

            let startY = Math.ceil(yMin / yStep) * yStep;
            for (let i = startY; i <= yMax; i += yStep) {
                if (Math.abs(i) < 1e-5) continue; 
                ctx.beginPath();
                ctx.strokeStyle = '#ecf0f1';
                ctx.moveTo(0, mapY(i));
                ctx.lineTo(canvas.width, mapY(i));
                ctx.stroke();
                
                let valStr = Number.isInteger(i) ? i.toString() : parseFloat(i.toFixed(1)).toString();
                ctx.fillText(valStr, mapX(0) + 5, mapY(i) + 4);
            }

            ctx.beginPath();
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 1.5;
            ctx.moveTo(0, mapY(0));
            ctx.lineTo(canvas.width, mapY(0));
            ctx.moveTo(mapX(0), 0);
            ctx.lineTo(mapX(0), canvas.height);
            ctx.stroke();
            
            ctx.fillText("0", mapX(0) + 5, mapY(0) + 15);
        }

        function draw() {
            drawGrid();

            const exprStr = funcInput.value;
            let currentX = parseFloat(xInputBox.value); 

            try {
                const node = math.parse(exprStr);
                const code = node.compile();
                
                const xNode = math.parse('x');
                const derivativeNode = math.derivative(node, xNode);
                const derivativeCode = derivativeNode.compile();
                
                // innerHTML kullanarak <sup> etiketlerinin çalışmasını sağlıyoruz
                let formattedDerivativeHTML = formatMathToHTML(derivativeNode.toString());
                derivEqDisplay.innerHTML = "f'(x) = " + formattedDerivativeHTML;

                ctx.beginPath();
                ctx.strokeStyle = '#5c8aab'; 
                ctx.lineWidth = 2.5;

                let first = true;
                for (let px = 0; px <= canvas.width; px += 2) {
                    let x = unmapX(px);
                    let y = code.evaluate({ x: x });

                    if (isNaN(y) || !isFinite(y)) continue;

                    let py = mapY(y);

                    if (first) {
                        ctx.moveTo(px, py);
                        first = false;
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.stroke();

                let currentY = code.evaluate({ x: currentX });
                let slope = derivativeCode.evaluate({ x: currentX });

                fxValDisplay.innerText = formatNumber(currentY);
                // Açıkça Slope = ... formatında yazdırıyoruz
                slopeValDisplay.innerText = "Slope = " + formatNumber(slope);

                const tangentLength = (xMax - xMin) * 0.15;
                const x1 = currentX - tangentLength;
                const y1 = currentY - slope * tangentLength;
                const x2 = currentX + tangentLength;
                const y2 = currentY + slope * tangentLength;

                ctx.beginPath();
                ctx.strokeStyle = '#27ae60'; 
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.moveTo(mapX(x1), mapY(y1));
                ctx.lineTo(mapX(x2), mapY(y2));
                ctx.stroke();
                ctx.setLineDash([]); 

                ctx.beginPath();
                ctx.fillStyle = '#e67e22'; 
                ctx.arc(mapX(currentX), mapY(currentY), 6, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

            } catch (error) {
                fxValDisplay.innerText = '---';
                slopeValDisplay.innerText = '---';
                derivEqDisplay.innerHTML = "Invalid Expression";
            }
        }

        funcInput.addEventListener('input', draw);
        
        xSlider.addEventListener('input', function() {
            xInputBox.value = parseFloat(this.value).toFixed(2);
            draw();
        });

        xInputBox.addEventListener('input', function() {
            let val = parseFloat(this.value);
            if(isNaN(val)) return; 
            
            if (val > 50) { val = 50; this.value = 50.00; }
            if (val < -50) { val = -50; this.value = -50.00; }

            if(val > parseFloat(xSlider.max)) { xSlider.max = val; }
            if(val < parseFloat(xSlider.min)) { xSlider.min = val; }

            xSlider.value = val;
            draw();
        });

        draw();
    </script>
</body>
</html>
