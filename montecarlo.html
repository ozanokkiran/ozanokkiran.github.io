<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte Carlo Pi Simülasyonu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        canvas { background-color: #f8fafc; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 text-slate-800">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-sm border border-slate-100 p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Sol Panel: Kontroller ve İstatistikler -->
        <div class="flex flex-col justify-center space-y-6">
            <div>
                <h1 class="text-3xl font-semibold text-slate-800 mb-2">Monte Carlo Simülasyonu</h1>
                <p class="text-slate-500 text-sm">Rastgele atılan noktalarla Pi sayısının animasyonlu tahmini.</p>
            </div>

            <div class="bg-indigo-50/50 p-6 rounded-xl border border-indigo-100">
                <div class="text-sm font-medium text-indigo-400 mb-1">Tahmini Pi Değeri</div>
                <div id="pi-estimate" class="text-4xl font-bold text-indigo-600 transition-all duration-200">3.141...</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                    <div class="text-xs text-emerald-600 mb-1">Daire İçindeki Noktalar</div>
                    <div id="inside-points" class="text-xl font-semibold text-emerald-700">0</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="text-xs text-slate-500 mb-1">Toplam Nokta</div>
                    <div id="total-points" class="text-xl font-semibold text-slate-700">0</div>
                </div>
            </div>

            <div class="space-y-3">
                <label class="text-sm font-medium text-slate-600">Animasyon Hızı: <span id="speed-label">50</span> nokta/kare</label>
                <input type="range" id="speed-slider" min="1" max="500" value="50" class="w-full accent-indigo-500">
            </div>

            <div class="flex space-x-3 pt-2">
                <button id="btn-start" class="flex-1 bg-teal-100 hover:bg-teal-200 text-teal-800 font-semibold py-3 rounded-xl transition-colors duration-200">Başlat</button>
                <button id="btn-stop" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-400 font-semibold py-3 rounded-xl transition-colors duration-200" disabled>Durdur</button>
                <button id="btn-reset" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition-colors duration-200">Sıfırla</button>
            </div>
        </div>

        <!-- Sağ Panel: Canvas (Görselleştirme) -->
        <div class="flex justify-center items-center">
            <div class="relative shadow-inner rounded-lg overflow-hidden border-2 border-slate-100">
                <canvas id="mc-canvas" width="400" height="400"></canvas>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('mc-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        // Kenar boşlukları (Padding) ekleyerek çizginin kesilmesini önlüyoruz
        const padding = 15;
        const radius = width - padding * 2;
        const originX = padding;
        const originY = height - padding;
        
        const piEstimateEl = document.getElementById('pi-estimate');
        const insidePointsEl = document.getElementById('inside-points');
        const totalPointsEl = document.getElementById('total-points');
        const speedSlider = document.getElementById('speed-slider');
        const speedLabel = document.getElementById('speed-label');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');

        let isRunning = false;
        let animationId;
        let total = 0;
        let inside = 0;

        function drawBackground() {
            ctx.clearRect(0, 0, width, height);
            
            // Koordinat eksenlerini çiz
            ctx.beginPath();
            ctx.moveTo(originX, padding);
            ctx.lineTo(originX, originY);
            ctx.lineTo(width - padding, originY);
            ctx.strokeStyle = '#94a3b8'; // slate-400
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Çeyrek daireyi çiz
            ctx.beginPath();
            ctx.arc(originX, originY, radius, 0, 1.5 * Math.PI, true);
            ctx.strokeStyle = '#cbd5e1'; // slate-300
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function addPoints() {
            if (!isRunning) return;
            
            const pointsPerFrame = parseInt(speedSlider.value);
            
            for (let i = 0; i < pointsPerFrame; i++) {
                // 0 ile 1 arası rastgele x, y
                const x = Math.random();
                const y = Math.random();
                const distanceSquared = x*x + y*y;
                
                // Noktayı canvas koordinatlarına uyarla (padding dahil)
                const canvasX = originX + (x * radius);
                const canvasY = originY - (y * radius);
                
                ctx.beginPath();
                ctx.arc(canvasX, canvasY, 1.5, 0, 2 * Math.PI);
                
                if (distanceSquared <= 1) {
                    ctx.fillStyle = '#34d399'; // Daire içi yeşil (emerald)
                    inside++;
                } else {
                    ctx.fillStyle = '#f87171'; // Daire dışı kırmızı (red)
                }
                ctx.fill();
                total++;
            }

            const piEstimate = (4 * inside) / total;
            piEstimateEl.innerText = piEstimate.toFixed(5);
            insidePointsEl.innerText = inside.toLocaleString('tr-TR');
            totalPointsEl.innerText = total.toLocaleString('tr-TR');

            animationId = requestAnimationFrame(addPoints);
        }

        btnStart.addEventListener('click', () => {
            isRunning = true;
            btnStart.disabled = true;
            btnStart.classList.replace('bg-teal-100', 'bg-slate-100');
            btnStart.classList.replace('text-teal-800', 'text-slate-400');
            
            btnStop.disabled = false;
            btnStop.classList.replace('bg-slate-100', 'bg-rose-100');
            btnStop.classList.replace('text-slate-400', 'text-rose-800');
            
            addPoints();
        });

        btnStop.addEventListener('click', () => {
            isRunning = false;
            cancelAnimationFrame(animationId);
            
            btnStart.disabled = false;
            btnStart.classList.replace('bg-slate-100', 'bg-teal-100');
            btnStart.classList.replace('text-slate-400', 'text-teal-800');
            
            btnStop.disabled = true;
            btnStop.classList.replace('bg-rose-100', 'bg-slate-100');
            btnStop.classList.replace('text-rose-800', 'text-slate-400');
        });

        btnReset.addEventListener('click', () => {
            isRunning = false;
            cancelAnimationFrame(animationId);
            total = 0;
            inside = 0;
            piEstimateEl.innerText = '3.141...';
            insidePointsEl.innerText = '0';
            totalPointsEl.innerText = '0';
            drawBackground();
            
            btnStart.disabled = false;
            btnStart.classList.replace('bg-slate-100', 'bg-teal-100');
            btnStart.classList.replace('text-slate-400', 'text-teal-800');
            
            btnStop.disabled = true;
            btnStop.classList.replace('bg-rose-100', 'bg-slate-100');
            btnStop.classList.replace('text-rose-800', 'text-slate-400');
        });

        speedSlider.addEventListener('input', (e) => {
            speedLabel.innerText = e.target.value;
        });

        // Sayfa ilk yüklendiğinde arka planı çiz
        drawBackground();
    </script>
</body>
</html>
