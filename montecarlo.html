<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Carlo Pi Simulation</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #fdf6e3; color: #333; margin-top: 30px; }
  canvas { background-color: white; border: 2px solid #ccc; border-radius: 8px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  button { padding: 12px 24px; font-size: 16px; background-color: #2aa198; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
  button:hover { background-color: #268bd2; }
  .stats { font-size: 18px; margin-top: 15px; }
  .pi-result { color: #d33682; font-size: 24px; font-weight: bold; }
</style>
</head>
<body>
  <h2>Monte Carlo Pi Estimation</h2>
  <p>Estimating the value of &pi; by dropping random points into a square containing a circle.</p>
  
  <button onclick="addPoints()">Drop 1000 Points</button>
  
  <div class="stats">
    Total Points: <span id="total">0</span> | Points inside Circle: <span id="inside">0</span>
  </div>
  <div class="pi-result">
    Estimated &pi; &asymp; <span id="pi_val">0.0000</span>
  </div>

  <canvas id="myCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    const r = canvas.width / 2;
    let total = 0;
    let inside = 0;

    // Draw the main circle
    ctx.beginPath();
    ctx.arc(r, r, r, 0, 2 * Math.PI);
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 2;
    ctx.stroke();

    function addPoints() {
      for(let i = 0; i < 1000; i++) {
        let x = Math.random() * canvas.width;
        let y = Math.random() * canvas.height;
        let dist = Math.sqrt(Math.pow(x - r, 2) + Math.pow(y - r, 2));
        
        total++;
        if(dist <= r) {
          inside++;
          ctx.fillStyle = 'rgba(42, 161, 152, 0.6)'; // Pastel teal for inside
        } else {
          ctx.fillStyle = 'rgba(211, 54, 130, 0.6)'; // Pastel pink for outside
        }
        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, 2 * Math.PI);
        ctx.fill();
      }
      
      let pi_est = 4 * (inside / total);
      document.getElementById('total').innerText = total;
      document.getElementById('inside').innerText = inside;
      document.getElementById('pi_val').innerText = pi_est.toFixed(4);
    }
  </script>
</body>
</html>
