<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Factorization & Divisors</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; /* Soft blue-gray background */
            color: #2d3748;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #2c5282;
            margin-bottom: 5px;
            font-size: 2.2em;
        }
        p.subtitle {
            color: #4a5568;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            border-top: 4px solid #4299e1;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        input[type="number"] {
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 18px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            color: #2d3748;
            background-color: #f7fafc;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #4299e1;
            background-color: #fff;
        }
        button {
            background-color: #4299e1;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #3182ce;
        }
        .results {
            display: none; /* Hidden until calculation */
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-box {
            background-color: #ebf8ff;
            border: 1px solid #bee3f8;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .result-title {
            font-size: 14px;
            font-weight: bold;
            color: #2b6cb0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            border-bottom: 1px solid #bee3f8;
            padding-bottom: 5px;
        }
        .prime-display {
            font-size: 28px;
            font-weight: bold;
            color: #2c5282;
            text-align: center;
            letter-spacing: 2px;
            font-family: 'Cambria Math', 'Times New Roman', serif;
        }
        .prime-display sup {
            font-size: 16px;
            color: #e53e3e; /* Red highlight for exponents */
        }
        .all-factors-box {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
        }
        .all-factors-text {
            font-size: 15px;
            color: #4a5568;
            line-height: 1.6;
            word-break: break-word;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
            color: #718096;
        }
        .stats-row span {
            font-weight: bold;
            color: #2d3748;
        }
        .error-msg {
            color: #e53e3e;
            font-size: 14px;
            margin-top: -15px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Number Theory Explorer</h1>
    <p class="subtitle">Prime Factorization & Divisors</p>

    <div class="container">
        <div class="input-group">
            <input type="number" id="numberInput" placeholder="Enter a positive integer (e.g. 360)" min="1">
            <button onclick="calculate()">Factorize</button>
        </div>
        <div class="error-msg" id="errorMsg">Please enter a valid positive integer greater than 0.</div>

        <div class="results" id="resultsArea">
            <!-- Prime Factorization (Top Priority) -->
            <div class="result-box">
                <div class="result-title">Prime Factorization</div>
                <div class="prime-display" id="primeDisplay">
                    <!-- e.g. 2³ × 3² × 5 -->
                </div>
            </div>

            <!-- All Factors List -->
            <div class="all-factors-box">
                <div class="result-title" style="color: #4a5568; border-bottom-color: #e2e8f0;">All Factors (Divisors)</div>
                <div class="all-factors-text" id="allFactorsDisplay">
                    <!-- e.g. 1, 2, 3, 4... -->
                </div>
                <div class="stats-row">
                    <div>Total number of divisors: <span id="numDivisors">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const numberInput = document.getElementById('numberInput');
        const resultsArea = document.getElementById('resultsArea');
        const errorMsg = document.getElementById('errorMsg');
        const primeDisplay = document.getElementById('primeDisplay');
        const allFactorsDisplay = document.getElementById('allFactorsDisplay');
        const numDivisorsDisplay = document.getElementById('numDivisors');

        // Execute on Enter key
        numberInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                calculate();
            }
        });

        function calculate() {
            const n = parseInt(numberInput.value);
            
            // Validation
            if (isNaN(n) || n < 1 || n > 9007199254740991) {
                errorMsg.style.display = 'block';
                resultsArea.style.display = 'none';
                return;
            }
            
            errorMsg.style.display = 'none';

            // 1. Prime Factorization Algorithm
            let temp = n;
            let primes = {};
            
            // Divide by 2
            while (temp % 2 === 0) {
                primes[2] = (primes[2] || 0) + 1;
                temp /= 2;
            }
            // Divide by odd numbers
            for (let i = 3; i * i <= temp; i += 2) {
                while (temp % i === 0) {
                    primes[i] = (primes[i] || 0) + 1;
                    temp /= i;
                }
            }
            // If temp is a prime number greater than 2
            if (temp > 2) {
                primes[temp] = 1;
            }

            // Formatting Prime String
            let primeStr = "";
            let numDivisors = 1;
            const keys = Object.keys(primes);
            
            if (n === 1) {
                primeStr = "1";
            } else if (keys.length === 0) {
                primeStr = `${n} (Prime)`;
            } else {
                primeStr = keys.map(p => {
                    let exponent = primes[p];
                    numDivisors *= (exponent + 1); // Math HL: Number of divisors formula
                    return exponent > 1 ? `${p}<sup>${exponent}</sup>` : `${p}`;
                }).join(" &times; ");
                
                // Add (Prime) tag if it's a single prime to the power of 1
                if (keys.length === 1 && primes[keys[0]] === 1) {
                    primeStr += " <span style='font-size:16px; color:#718096; font-family:Segoe UI;'>(Prime Number)</span>";
                }
            }

            // 2. All Factors Algorithm
            let factors = [];
            for (let i = 1; i * i <= n; i++) {
                if (n % i === 0) {
                    factors.push(i);
                    if (i * i !== n) {
                        factors.push(n / i);
                    }
                }
            }
            // Sort factors numerically
            factors.sort((a, b) => a - b);

            // 3. Update UI
            primeDisplay.innerHTML = primeStr;
            allFactorsDisplay.innerHTML = factors.join(', ');
            numDivisorsDisplay.innerHTML = factors.length; // Same as numDivisors

            resultsArea.style.display = 'block';
        }
    </script>
</body>
</html>
